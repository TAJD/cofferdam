# Tracked default (see rust-toolchain.toml for the related GNU-vs-MSVC note).
#
# cofferdam's C dependencies (tree-sitter, via the `cc` crate) need the MSVC
# toolchain on Windows, not MinGW gcc. If your shell exports a global CC/CXX
# pointing at a MinGW/gcc install (e.g. for building other projects' native
# extensions), cc-rs picks it up here too, compiling tree-sitter's C sources
# with MinGW while the rest of the workspace links with MSVC's link.exe —
# producing `unresolved external symbol __mingw_vfprintf` / `__mingw_vsnprintf`
# and a failed link. Force-clearing CC/CXX for this workspace makes cc-rs
# fall back to auto-detecting the right compiler per platform (MSVC's cl.exe
# on Windows, the system cc on Linux/macOS) regardless of what's exported
# globally. No CI job sets CC/CXX, so this is a no-op there.
#
# If you deliberately need a custom CC/CXX for this repo specifically (e.g.
# a cross-compiler or ccache wrapper), override these values here rather
# than relying on your shell environment — `force = true` means the shell
# env is ignored.
[env]
CC = { value = "", force = true }
CXX = { value = "", force = true }
