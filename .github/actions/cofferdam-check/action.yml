name: cofferdam-check
description: Run cofferdam against your TypeScript codebase and surface findings as workflow annotations

inputs:
  paths:
    description: Space-separated list of files or directories to analyze.
    default: "."
  fail-on:
    description: "Severity threshold for exit-1. One of: low, medium, high."
    default: "high"
  baseline:
    description: Path to a baseline file. Pass empty string to disable baseline detection.
    default: ".cofferdam/baseline.json"
  since:
    description: PR mode — only check files changed since this git ref. Leave empty to scan all.
    default: ""
  version:
    description: cofferdam release tag to use, e.g. "v0.2.0". "latest" resolves to the current latest release.
    default: "latest"
  config:
    description: Path to a cofferdam.toml config file. Leave empty (default) to use auto-discovery — cofferdam walks up from the working directory until it finds a cofferdam.toml or hits a `.git` directory. Set this only to point at a config in a non-standard location.
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve-version
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TAJD/cofferdam/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
        else
          TAG="${{ inputs.version }}"
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Resolved cofferdam version: ${TAG}"

    - name: Detect platform
      id: detect-platform
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"
        TAG="${{ steps.resolve-version.outputs.tag }}"

        if [ "$OS" = "Linux" ] && [ "$ARCH" = "X64" ]; then
          ASSET="cofferdam-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          EXT="tar.gz"
        elif [ "$OS" = "Linux" ] && [ "$ARCH" = "ARM64" ]; then
          ASSET="cofferdam-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
          EXT="tar.gz"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "X64" ]; then
          ASSET="cofferdam-${TAG}-x86_64-apple-darwin.tar.gz"
          EXT="tar.gz"
        elif [ "$OS" = "macOS" ] && [ "$ARCH" = "ARM64" ]; then
          ASSET="cofferdam-${TAG}-aarch64-apple-darwin.tar.gz"
          EXT="tar.gz"
        elif [ "$OS" = "Windows" ] && [ "$ARCH" = "X64" ]; then
          ASSET="cofferdam-${TAG}-x86_64-pc-windows-msvc.zip"
          EXT="zip"
        else
          echo "Unsupported runner OS/arch: $OS/$ARCH" >&2
          exit 1
        fi

        echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
        echo "ext=${EXT}" >> "$GITHUB_OUTPUT"
        echo "Resolved asset: ${ASSET}"

    - name: Cache cofferdam binary
      id: cache-binary
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cofferdam-bin
        key: cofferdam-${{ steps.resolve-version.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download and extract cofferdam
      if: steps.cache-binary.outputs.cache-hit != 'true'
      shell: bash
      run: |
        TAG="${{ steps.resolve-version.outputs.tag }}"
        ASSET="${{ steps.detect-platform.outputs.asset }}"
        EXT="${{ steps.detect-platform.outputs.ext }}"
        URL="https://github.com/TAJD/cofferdam/releases/download/${TAG}/${ASSET}"
        DEST="${{ runner.temp }}/cofferdam-bin"
        TMP="${{ runner.temp }}/cofferdam-dl"

        mkdir -p "$DEST" "$TMP"
        echo "Downloading $URL"
        curl -fsSL -o "$TMP/${ASSET}" "$URL"

        if [ "$EXT" = "tar.gz" ]; then
          tar -C "$DEST" -xzf "$TMP/${ASSET}" cofferdam
        else
          # zip (Windows) — unzip extracts cofferdam.exe
          unzip -q -o "$TMP/${ASSET}" -d "$DEST"
        fi

        rm -rf "$TMP"
        echo "Extracted to $DEST"
        ls -la "$DEST"

    - name: Add cofferdam to PATH
      shell: bash
      run: echo "${{ runner.temp }}/cofferdam-bin" >> "$GITHUB_PATH"

    - name: Run cofferdam
      id: run-cofferdam
      shell: bash
      run: |
        # Build optional flag fragments
        BASELINE_FLAG=""
        if [ -n "${{ inputs.baseline }}" ]; then
          BASELINE_FLAG="--baseline ${{ inputs.baseline }}"
        fi

        SINCE_FLAG=""
        if [ -n "${{ inputs.since }}" ]; then
          SINCE_FLAG="--since ${{ inputs.since }}"
        fi

        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config ${{ inputs.config }}"
        fi

        set +e
        # shellcheck disable=SC2086
        cofferdam check ${{ inputs.paths }} \
          --robot --format=json \
          --fail-on "${{ inputs.fail-on }}" \
          $BASELINE_FLAG \
          $SINCE_FLAG \
          $CONFIG_FLAG \
          > "${{ github.workspace }}/findings.json"
        EXIT=$?
        set -e

        echo "exit-code=${EXIT}" >> "$GITHUB_OUTPUT"
        echo "cofferdam exited with code ${EXIT}"

    - name: Emit GitHub annotations
      shell: bash
      run: |
        FAIL_ON="${{ inputs.fail-on }}"
        FINDINGS_FILE="${{ github.workspace }}/findings.json"

        # Severity ordering: info=0, low=1, medium=2, high=3, critical=4
        severity_rank() {
          case "$1" in
            info)     echo 0 ;;
            low)      echo 1 ;;
            medium)   echo 2 ;;
            high)     echo 3 ;;
            critical) echo 4 ;;
            *)        echo 0 ;;
          esac
        }

        THRESHOLD=$(severity_rank "$FAIL_ON")

        if [ ! -s "$FINDINGS_FILE" ]; then
          echo "No findings.json produced; skipping annotations."
          exit 0
        fi

        # Emit one workflow command per finding.
        # jq iterates findings[], printing tab-separated fields.
        jq -r '.findings[] | [.severity, .file, (.line | tostring), (.column | tostring), .id, .message] | @tsv' \
          "$FINDINGS_FILE" | \
        while IFS=$'\t' read -r severity file line col check_id message; do
          rank=$(severity_rank "$severity")
          if [ "$rank" -ge "$THRESHOLD" ]; then
            level="error"
          else
            level="warning"
          fi
          # Escape percent signs, CR, and LF in the message per the GitHub
          # workflow command spec (https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-a-notice-message)
          safe_msg=$(echo "$message" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::${level} file=${file},line=${line},col=${col},title=${check_id}::${safe_msg}"
        done

    - name: Exit with cofferdam result
      shell: bash
      run: exit ${{ steps.run-cofferdam.outputs.exit-code }}
