# CD-35 — locks in the CD-28 epic's performance wins (CD-29 pass-2
# parse reuse, CD-30 rayon parallel run loop) so they can't regress
# silently. Two independent gates:
#
# 1. `bench-compare` — runs the criterion suite (crates/cofferdam-engine/benches)
#    on the PR head, saves it as a baseline, then re-runs the same
#    binary against a baseline captured on the PR's merge-base and
#    fails if criterion's own change-point detection reports a
#    regression. This is a manual equivalent of criterion-compare-action:
#    two `cargo bench --save-baseline` runs plus one `--baseline`
#    comparison run, all against the same PR-head binary so build
#    variance doesn't leak into the comparison.
# 2. `memory-gate` — the RSS baseline gate from `scripts/smoke.ps1 -Memory`,
#    run on both Linux and Windows (pwsh ships on both GitHub-hosted
#    runners; `Process.PeakWorkingSet64` is backed by `/proc/<pid>/status`
#    on Linux and the native working-set counter on Windows).

name: bench

on:
  pull_request:
    paths:
      - "crates/cofferdam-engine/**"
      - "crates/cofferdam-checks/**"
      - "crates/cofferdam-core/**"
      - "examples/**"
      - "scripts/smoke.ps1"
      - "scripts/smoke-baseline.json"
      - ".github/workflows/bench.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bench-compare:
    name: criterion compare vs base branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bench PR head, save as baseline "pr"
        run: cargo bench -p cofferdam-engine --bench engine_bench -- --save-baseline pr

      - name: Check out merge-base of the PR
        run: |
          git checkout "$(git merge-base HEAD "origin/${{ github.base_ref }}")"

      - name: Bench merge-base, save as baseline "base"
        run: cargo bench -p cofferdam-engine --bench engine_bench -- --save-baseline base

      - name: Check out PR head again
        run: git checkout "${{ github.event.pull_request.head.sha }}"

      - name: Compare PR head against base-branch baseline
        id: compare
        run: |
          set -o pipefail
          cargo bench -p cofferdam-engine --bench engine_bench -- --baseline base 2>&1 | tee bench-compare.txt

      - name: Fail on detected regression (beyond noise tolerance)
        if: always()
        run: |
          # CD-40 lever 5 PR 2 exposed this gate's original zero-tolerance
          # form (any p<0.05 change fails, regardless of magnitude) as
          # unworkable on shared ubuntu-latest runners: across four CI runs
          # of an unambiguously behavior-preserving change (verified
          # byte-identical output against a real-world corpus every time),
          # the flagged point-estimate "regression" ranged from 1.9% to
          # 5.9%, and one run's own "pr" baseline step vs its later compare
          # step — two benches of the *identical* PR-head commit, ~3
          # minutes apart in the same job — swung 2.2% on their own with
          # p=0.00 both times. That means runner noise alone clears the
          # statistical-significance bar, and can plausibly stack higher
          # once both the "pr" and "base" baseline captures each carry
          # their own noise. 8% gives roughly 1.4x margin over the largest
          # noise-attributable point estimate observed (5.9%) while still
          # catching a regression an order of magnitude worse (e.g. an
          # accidental O(N^2) reintroduction). A point estimate below
          # NOISE_TOLERANCE_PCT is treated as noise rather than a real
          # regression; only combine it with criterion's own significance
          # flag once it clears this bar.
          NOISE_TOLERANCE_PCT=8.0
          python3 - "$NOISE_TOLERANCE_PCT" <<'PY'
          import re
          import sys

          threshold = float(sys.argv[1])
          text = open("bench-compare.txt").read()
          pattern = re.compile(
              r"change:\s*\[[+-][\d.]+%\s+([+-][\d.]+)%\s+[+-][\d.]+%\]\s*\(p = [\d.]+[^\n]*\)\n\s*"
              r"(Performance has regressed\.|Performance has improved\.|No change in performance detected\.)"
          )
          regressions = []
          for mid_str, verdict in pattern.findall(text):
              mid = float(mid_str)
              if "regressed" in verdict and mid > threshold:
                  regressions.append(mid)

          if regressions:
              print(
                  f"::error::Criterion detected regression(s) exceeding the "
                  f"{threshold}% noise tolerance: {regressions}"
              )
              sys.exit(1)
          print(f"No regression exceeding {threshold}% tolerance detected.")
          PY

      - name: Post comparison as a PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bench-compare.txt', 'utf8');
            const body = [
              '### Criterion benchmark comparison (PR head vs base branch)',
              '',
              '```',
              output.slice(-60000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  context-perf-gate:
    name: cofferdam context perf gate (CD-164)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cofferdam context perf gate (warm-cache p50 <= 2s, p95 <= 5s on a synthetic 5k-file corpus)
        run: cargo test --release -p cofferdam-engine --test context_perf_gate -- --ignored --nocapture

  memory-gate:
    name: memory gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: memory-gate-${{ matrix.os }}
      - name: Build cofferdam-cli (release)
        run: cargo build --release -p cofferdam-cli
      - name: Run memory baseline gate
        shell: pwsh
        run: ./scripts/smoke.ps1 -Memory
