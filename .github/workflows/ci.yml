# Always-on CI for the Rust workspace.
# Cheap, fast, runs on every push/PR. The release matrix lives in release.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Force any JS action still declared `using: node20` onto Node 24 ahead of
  # the 2026-06-02 default flip / 2026-09-16 Node 20 removal.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-release-build:
    # Guards release-only breakage on Windows MSVC that the debug
    # `cargo build`/`cargo test` in `test` can't catch — notably the
    # rustc 1.95 / LLVM 22 ThinLTO + strip crash tracked in cd-rvn.
    # `release.yml` only builds `--release` on a tag, so without this a
    # release-build regression would surface at tag-cut time instead of
    # on the PR that introduced it. Uses the workspace `[profile.release]`
    # (thin LTO + codegen-units=1 + strip) exactly as a real release does.
    name: windows release build (cd-rvn guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build of cofferdam-cli (MSVC, full release profile)
        run: cargo build --release -p cofferdam-cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify auto-generated docs are up to date
        run: cargo run -p cofferdam-cli --quiet -- gen-docs --check

  dogfood:
    name: cofferdam runs on its own SDK (cd-9tq)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cofferdam-cli
        run: cargo build --release -p cofferdam-cli
      - name: Run cofferdam against the published SDK surface
        # `--baseline` lets pre-existing findings ride; the gate is on NEW
        # findings only. `--fail-on=high` keeps low/medium baselined items
        # out of the CI verdict; raise the bar by editing this flag.
        run: |
          ./target/release/cofferdam check packages/check-sdk/src \
            --baseline .cofferdam/baseline.json \
            --fail-on=high

  dogfood-rust:
    name: cofferdam runs on its own Rust workspace (cd-91zc)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cofferdam-cli
        run: cargo build --release -p cofferdam-cli
      - name: Run cofferdam against the Rust workspace
        # Scans the eight workspace `src/` directories — explicit list
        # so test fixtures (intentional bad code) and integration tests
        # don't pollute the gate. New Rust findings on lib code surface
        # here; baselined ones print as `[baselined]` and ride.
        # `--fail-on=high` is symmetrical with the SDK dogfood above.
        run: |
          ./target/release/cofferdam check \
            crates/cofferdam-core/src \
            crates/cofferdam-engine/src \
            crates/cofferdam-checks/src \
            crates/cofferdam-formatters/src \
            crates/cofferdam-cli/src \
            crates/cofferdam-lsp/src \
            crates/cofferdam-napi/src \
            crates/cofferdam-rust/src \
            --baseline .cofferdam/baseline-rust.json \
            --fail-on=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
