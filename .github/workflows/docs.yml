name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/cofferdam/README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/cofferdam/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Force any JS action still declared `using: node20` onto Node 24 ahead of
  # the 2026-06-02 default flip / 2026-09-16 Node 20 removal. Mirrors the
  # parity setting in release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Build VitePress site
        working-directory: docs
        run: pnpm docs:build
      - name: Verify pages serve content without JS (CD-63 E1)
        working-directory: docs
        run: |
          set -e
          # Grep the built HTML directly -- this is exactly what a
          # non-JS fetcher (curl, an agent's HTTP client) receives from
          # GitHub Pages. VitePress pre-renders to static HTML by
          # default; this step exists so a future regression to a
          # client-rendered app shell fails CI instead of silently
          # serving empty pages to agents.
          check() {
            grep -q "$2" ".vitepress/dist/$1" || {
              echo "::error::$1 missing expected content ($2) -- page may not be statically rendered"
              exit 1
            }
          }
          check "index.html" "cofferdam"
          check "agents.html" "cofferdam agents"
          check "hooks.html" "PreToolUse"
          check "mcp.html" "cofferdam.check"
          check "checks/index.html" "Consistency"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    # Only deploy on push to main — PR validation only runs `build`
    # so a broken docs change fails the PR check without trying to
    # publish to GitHub Pages from a fork.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
