# Release workflow — multi-platform binaries on tag push.
#
# Triggered by:
#   - pushing a `v*` tag (the canonical release path)
#   - manual workflow_dispatch (for testing the matrix without cutting a release)
#
# Cross-compilation strategy:
#   - Native builds where possible (linux-x64-gnu on ubuntu, mac targets on
#     their respective hosts, windows-x64 on windows)
#   - cargo-zigbuild for the cross targets (linux-arm64-gnu, linux-musl x64+arm64).
#     Simpler than `cross` (no docker required on the runner) and battle-tested.
#
# Out of scope (pre-phase-4):
#   - npm publish — handled by the napi-rs path once cofferdam-napi is wired up
#   - crates.io publish — separate workflow when the trait surface stabilizes
#   - Apple notarization / Windows code signing — adds complexity; skipped for v0.1.0

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for npm provenance

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Force JS actions still declared as `node20` (e.g. mlugg/setup-zig@v2) to run
  # on Node 24. GitHub flips this default 2026-06-02 and removes Node 20 from
  # runners 2026-09-16; opting in early surfaces incompatibilities now and
  # silences the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — native gnu, plus zigbuild for the others
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
            cross: true
          # macOS — both targets built on the macos-15 (Apple Silicon) runner
          # via cargo-zigbuild. macos-13 (Intel) runners are scarce on GitHub's
          # free tier and cause hours-long queue waits, and macos-14 begins
          # deprecation 2026-07-06 (fully unsupported by 2026-11-02). zigbuild
          # handles the x86_64 cross-compile cleanly.
          - target: x86_64-apple-darwin
            host: macos-15
            cross: true
          - target: aarch64-apple-darwin
            host: macos-15
            cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: matrix.cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.cross
        run: cargo install --locked cargo-zigbuild

      - name: Install cargo-edit
        # Provides `cargo set-version`, which updates
        # [workspace.package].version and every [workspace.dependencies]
        # path-dep version pin in one call. Replaces the regex-on-TOML
        # approach this job used pre-cd-8rp. `--locked` keeps the
        # install reproducible across matrix shards.
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo install cargo-edit --locked

      - name: Sync workspace version with tag
        # The cofferdam npm package is bumped at publish-npm time via
        # `npm version`; the Rust workspace version needs the same
        # treatment so the binary's `--version` matches the released
        # tag. Without this the tarballs ship with a stale source
        # version (e.g. binary reports 0.1.4 inside the v0.2.0 release).
        # Repeated for every matrix shard — cheap, deterministic, no
        # cross-job artifact passing required.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo set-version --workspace "$version"
          # Echo the result so the run log shows what landed in Cargo.toml
          # (matches the print() the old python step emitted).
          cat Cargo.toml

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --bin cofferdam --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.cross
        run: cargo zigbuild --release --bin cofferdam --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="cofferdam-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cofferdam dist/cofferdam
          cp README.md LICENSE dist/
          tar -C dist -czf "$name.tar.gz" cofferdam README.md LICENSE
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "cofferdam-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cofferdam.exe" "dist/cofferdam.exe"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/cofferdam.exe, dist/README.md, dist/LICENSE -DestinationPath "$name.zip"
          (Get-FileHash -Algorithm SHA256 "$name.zip").Hash | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: cofferdam-${{ matrix.target }}
          path: |
            cofferdam-*.tar.gz
            cofferdam-*.tar.gz.sha256
            cofferdam-*.zip
            cofferdam-*.zip.sha256
          if-no-files-found: error

  publish:
    name: publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: publish to npm
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No registry-url + no auth token: this job authenticates to npm via
          # OIDC (Trusted Publisher configured at
          # npmjs.com/package/@cofferdam/cofferdam/access). `id-token: write`
          # permission at the workflow level is what makes it work.

      - name: Pin npm to 11.x (OIDC publishing requires npm 11.5.1+)
        # Node 24 already ships with npm 11.x. We still re-install to a pinned
        # major to guarantee >= 11.5.1, but avoid `npm@latest` — the self-upgrade
        # path corrupts the global install partway through (MODULE_NOT_FOUND
        # 'promise-retry'). Pinning to `npm@11` is the documented workaround.
        run: npm install -g npm@11

      - name: Sync npm package version with tag
        working-directory: packages/cofferdam
        run: |
          # Strip leading 'v' from the tag to get the semver string
          version="${GITHUB_REF_NAME#v}"
          # Use npm to set the version (no git tag — we're already on the tag commit)
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Verify CHANGELOG.md for this release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Assert [Unreleased] section is empty (no non-blank lines before the next ## [)
          unreleased_body=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if echo "$unreleased_body" | grep -qP '\S'; then
            echo "ERROR: ## [Unreleased] section is not empty. Move entries to ## [$version] before releasing."
            exit 1
          fi
          # Assert that a versioned section exists for this tag
          if ! grep -qP "^## \[$version\]" CHANGELOG.md; then
            echo "ERROR: No ## [$version] section found in CHANGELOG.md. Add a release section before publishing."
            exit 1
          fi
          echo "CHANGELOG.md OK for $version"

      - name: Verify cofferdam tarball includes bin/cofferdam.js
        # Guard against a successful-but-empty publish (cd-iye / gh #10).
        # `npm pack --dry-run --json` reports the exact file list that
        # would land in the tarball; if the entry-point shim is missing
        # the install will appear to succeed but fail at the first
        # `cofferdam` invocation. Cheap to gate.
        working-directory: packages/cofferdam
        run: |
          set -euo pipefail
          npm pack --dry-run --json \
            | jq -e '.[0].files | map(.path) | index("bin/cofferdam.js")' > /dev/null \
            || { echo "ERROR: cofferdam tarball is missing bin/cofferdam.js"; \
                 echo "Listing what npm pack would include:"; \
                 npm pack --dry-run --json | jq '.[0].files | map(.path)'; \
                 exit 1; }
          npm pack --dry-run --json \
            | jq -e '.[0].files | map(.path) | index("scripts/postinstall.js")' > /dev/null \
            || { echo "ERROR: cofferdam tarball is missing scripts/postinstall.js"; exit 1; }

      - name: Publish to npm via Trusted Publisher (OIDC)
        working-directory: packages/cofferdam
        run: |
          # No NODE_AUTH_TOKEN: npm CLI 11.5.1+ on a GitHub Actions runner
          # auto-exchanges the OIDC token (via id-token:write permission)
          # for a short-lived publish credential, provided the package has
          # a Trusted Publisher configured pointing at this exact workflow
          # filename and repo. --provenance is automatic with OIDC but we
          # pass it explicitly for clarity.
          npm publish --provenance --access public

  publish-check-sdk:
    # Companion to publish-npm: ships @cofferdam/check-sdk in lockstep
    # with the cofferdam binary on the same v* tag. Plugin authors get a
    # known-compatible (SDK X.Y.Z, cofferdam X.Y.Z) pair from one
    # release. Lockstep is intentional pre-1.0 — see packages/check-sdk/
    # README "Versioning" section.
    name: publish @cofferdam/check-sdk to npm
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # OIDC Trusted Publisher must be configured at
          # npmjs.com/package/@cofferdam/check-sdk/access pointing at
          # this workflow filename + repo. Same setup as the cofferdam
          # package, just on the SDK's own access page.

      - name: Pin npm to 11.x
        run: npm install -g npm@11

      - name: Sync SDK package version with tag
        working-directory: packages/check-sdk
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build the SDK (tsc → dist/)
        working-directory: packages/check-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify SDK tarball includes dist/index.js + dist/index.d.ts
        # Guard against a successful-but-empty publish (cd-iye / gh #10).
        # 0.2.0 and 0.2.1 both shipped without dist/ — package.json was
        # correct, but the build step had been skipped before the
        # publish, so the tarball that landed on npm carried only the
        # README and LICENSE. Downstream consumers loaded `undefined`.
        # `npm pack --dry-run --json` is the authoritative file list.
        # `prepublishOnly` in package.json is the belt; this is the
        # suspenders.
        working-directory: packages/check-sdk
        run: |
          set -euo pipefail
          for required in dist/index.js dist/index.d.ts; do
            npm pack --dry-run --json \
              | jq -e --arg p "$required" '.[0].files | map(.path) | index($p)' > /dev/null \
              || { echo "ERROR: @cofferdam/check-sdk tarball is missing $required"; \
                   echo "Listing what npm pack would include:"; \
                   npm pack --dry-run --json | jq '.[0].files | map(.path)'; \
                   exit 1; }
          done

      - name: Publish @cofferdam/check-sdk via Trusted Publisher (OIDC)
        working-directory: packages/check-sdk
        run: npm publish --provenance --access public

  npm-smoke:
    # cd-5zn: end-to-end install verification on a fresh runner per OS,
    # using the version we just published. Catches postinstall/binary
    # bundling regressions within minutes of cutting a release.
    #
    # Deliberately separate from `publish-npm` so the smoke side can't
    # roll back an otherwise good publish — but it `needs: publish-npm`
    # and the matrix is fail-fast: false, so a failure on any OS still
    # surfaces a red check at the workflow level. Whoever cut the release
    # sees it within minutes.
    name: smoke ${{ matrix.host }}
    needs: publish-npm
    runs-on: ${{ matrix.host }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Wait for npm registry to propagate
        # The npm CDN can lag a minute or two after `npm publish` returns,
        # especially on the macOS / Windows runners that pull from a
        # different edge. Poll up to 2 minutes before giving up.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 12); do
            if npm view "@cofferdam/cofferdam@$version" version > /dev/null 2>&1; then
              echo "@cofferdam/cofferdam@$version visible on npm (attempt $attempt)"
              exit 0
            fi
            echo "waiting for @cofferdam/cofferdam@$version on npm... ($attempt/12)"
            sleep 10
          done
          echo "ERROR: @cofferdam/cofferdam@$version still not visible after 2 minutes"
          exit 1

      - name: Run npm install smoke test
        # `shell: bash` works on Windows runners too via Git Bash; the
        # smoke script itself is pure Node and platform-agnostic.
        shell: bash
        run: node .github/scripts/npm-smoke.mjs "${GITHUB_REF_NAME#v}"
