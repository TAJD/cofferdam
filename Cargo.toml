[workspace]
resolver = "2"
members = [
    "crates/cofferdam-core",
    "crates/cofferdam-ts",
    "crates/cofferdam-engine",
    "crates/cofferdam-checks",
    "crates/cofferdam-formatters",
    "crates/cofferdam-cli",
    "crates/cofferdam-lsp",
]

# `cofferdam-napi` is intentionally NOT a workspace member. It builds a
# Node.js native addon (.node file) and links against `libnode.dll`,
# which lives in the Node.js source distribution — NOT a default install.
# Including it would break `cargo build --workspace` for contributors
# without the Node dev environment set up.
#
# To build it, use the @napi-rs/cli flow from `packages/check-sdk/` (or
# its sibling runtime package), or run `cargo build --manifest-path
# crates/cofferdam-napi/Cargo.toml` after setting up `libnode.dll` via
# `node-gyp` or by pointing `NAPI_NODE_DEV_DIR` at a Node source tree.
#
# The crate keeps a `[workspace]` exclude marker by living outside the
# `members` list — it's a standalone Cargo project that depends on the
# rest of the workspace via path dependencies.
exclude = ["crates/cofferdam-napi"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/TAJD/cofferdam"
authors = ["cofferdam contributors"]
rust-version = "1.78"

[workspace.dependencies]
cofferdam-core = { path = "crates/cofferdam-core", version = "0.1.4" }
cofferdam-ts = { path = "crates/cofferdam-ts", version = "0.1.4" }
cofferdam-engine = { path = "crates/cofferdam-engine", version = "0.1.4" }
cofferdam-checks = { path = "crates/cofferdam-checks", version = "0.1.4" }
cofferdam-formatters = { path = "crates/cofferdam-formatters", version = "0.1.4" }

# Third-party (kept narrow at phase 0; expanded as phases land)
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
oxc_allocator = "0.128"
oxc_ast = "0.128"
oxc_ast_visit = "0.128"
oxc_diagnostics = "0.128"
oxc_parser = "0.128"
oxc_span = "0.128"
oxc_syntax = "0.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
insta = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
