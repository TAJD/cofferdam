[workspace]
resolver = "2"
members = [
    "crates/cofferdam-core",
    "crates/cofferdam-engine",
    "crates/cofferdam-checks",
    "crates/cofferdam-formatters",
    "crates/cofferdam-cli",
    "crates/cofferdam-lsp",
    "crates/cofferdam-napi",
    "crates/cofferdam-rust",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/TAJD/cofferdam"
authors = ["cofferdam contributors"]
rust-version = "1.79"

[workspace.dependencies]
cofferdam-core = { path = "crates/cofferdam-core", version = "0.3.2" }
cofferdam-engine = { path = "crates/cofferdam-engine", version = "0.3.2" }
cofferdam-checks = { path = "crates/cofferdam-checks", version = "0.3.2" }
cofferdam-formatters = { path = "crates/cofferdam-formatters", version = "0.3.2" }

# Third-party (kept narrow at phase 0; expanded as phases land)
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
oxc_allocator = "0.128"
oxc_ast = "0.128"
oxc_ast_visit = "0.128"
oxc_diagnostics = "0.128"
oxc_parser = "0.128"
oxc_resolver = "11"
oxc_span = "0.128"
oxc_syntax = "0.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
insta = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# `strip = "symbols"` triggers a rustc internal crash
# (STATUS_HEAP_CORRUPTION / ACCESS_VIOLATION) under ThinLTO on
# Windows MSVC with rustc 1.95 / LLVM 22 — fresh builds fail before
# emitting a binary. `strip = "debuginfo"` produces an equivalent-size
# binary on Windows (debug info lives in the side-by-side .pdb anyway)
# and avoids the crash. Don't tighten back to "symbols" without
# verifying a clean-tree `cargo build --release` succeeds.
strip = "debuginfo"
