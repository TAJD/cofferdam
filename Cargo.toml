[workspace]
resolver = "2"
members = [
    "crates/cofferdam-core",
    "crates/cofferdam-engine",
    "crates/cofferdam-checks",
    "crates/cofferdam-formatters",
    "crates/cofferdam-cli",
    "crates/cofferdam-graph",
    "crates/cofferdam-html",
    "crates/cofferdam-lsp",
    "crates/cofferdam-mcp",
    "crates/cofferdam-napi",
    "crates/cofferdam-rust",
    "crates/cofferdam-typst",
]

[workspace.package]
version = "0.3.12"
edition = "2021"
license = "MIT"
repository = "https://github.com/TAJD/cofferdam"
authors = ["cofferdam contributors"]
rust-version = "1.93"

[workspace.dependencies]
cofferdam-cli = { path = "crates/cofferdam-cli", version = "0.3.12" }
cofferdam-core = { path = "crates/cofferdam-core", version = "0.3.12" }
cofferdam-engine = { path = "crates/cofferdam-engine", version = "0.3.12" }
cofferdam-checks = { path = "crates/cofferdam-checks", version = "0.3.12" }
cofferdam-formatters = { path = "crates/cofferdam-formatters", version = "0.3.12" }
cofferdam-graph = { path = "crates/cofferdam-graph", version = "0.3.12" }
cofferdam-html = { path = "crates/cofferdam-html", version = "0.3.12" }
cofferdam-rust = { path = "crates/cofferdam-rust", version = "0.3.12" }
cofferdam-typst = { path = "crates/cofferdam-typst", version = "0.3.12" }

# Third-party (kept narrow at phase 0; expanded as phases land)
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
oxc_allocator = "0.128"
oxc_ast = "0.128"
oxc_ast_visit = "0.128"
oxc_diagnostics = "0.128"
oxc_parser = "0.128"
oxc_resolver = "11"
oxc_span = "0.128"
oxc_syntax = "0.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# cd-9hp.4 cp1 — self-referential parse-cache entry (Allocator + parse
# result borrowed from it). The pattern in `crates/cofferdam-core/src/parser.rs`
# already noted self_cell as a viable option; the parse cache makes
# the dep earn its keep.
self_cell = "1"
# CD-30 — per-file parallelism for the engine's run loop. Each rayon
# worker parses its own file with a local `Allocator`; oxc's
# arena-based AST holds raw pointers internally and is not `Send`, so
# unlike `FindingsCache` the parse cache can't be shared across
# threads (see `cache.rs`'s doc comment) — parallel runs accept a
# redundant per-file parse in exchange for real multi-core scaling.
rayon = "1"
# cd-9hp.4 cp1b — file-system watcher backing `cofferdam watch`'s
# daemon loop. notify v8 picks the platform-recommended backend
# (ReadDirectoryChangesW on Windows, FSEvents on macOS, inotify on
# Linux); we layer a manual recv-timeout debounce on top.
notify = "8"
# cd-9hp.4 cp5 — LSP server. lsp-server is rust-analyzer's sync
# transport library; pairs with lsp-types for the protocol message
# definitions. We pin to 3.17 features only (no proposed). No tokio
# in the workspace — the engine is sync so async buys nothing.
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5"
# cd-9hp.9 cp1 — small-string optimisation for canonical-graph schema
# identifiers (namespace tags, symbol names, layer names). Used by
# cofferdam-graph; pulled into the workspace deps so its version is
# pinned alongside the other shared crates.
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
toml = "0.8"
# CD-64 D2 — format-preserving TOML edits for `cofferdam baseline
# ratchet` (rewrites the `[budgets]` table in cofferdam.toml without
# disturbing the rest of the user's file, comments included).
toml_edit = "0.22"
insta = { version = "1", features = ["filters"] }
proptest = "1"
# CD-35 — criterion benches lock in the CD-28 epic's perf wins
# (crates/cofferdam-engine/benches) so later changes can't silently
# regress them.
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# `strip = "symbols"` triggers a rustc internal crash
# (STATUS_HEAP_CORRUPTION / ACCESS_VIOLATION) under ThinLTO on
# Windows MSVC with rustc 1.95 / LLVM 22 — fresh builds fail before
# emitting a binary. `strip = "debuginfo"` produces an equivalent-size
# binary on Windows (debug info lives in the side-by-side .pdb anyway)
# and avoids the crash. Don't tighten back to "symbols" without
# verifying a clean-tree `cargo build --release` succeeds.
strip = "debuginfo"
