[package]
name = "cofferdam-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in checks shipped with cofferdam (Consistency, Design, Readability, Refactor, Warning)."

[dependencies]
cofferdam-core = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_semantic = "0.128.0"
oxc_span = { workspace = true }
oxc_syntax = "0.128"
# unicode-ident already lives in the dep tree via oxc transitively;
# pull it in directly so DuplicateBlock's tokeniser can recognise
# Unicode identifiers (TS allows `λ`, `α`, Han characters, etc.).
unicode-ident = "1"
