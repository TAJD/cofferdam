[package]
name = "cofferdam-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in checks shipped with cofferdam (Consistency, Design, Readability, Refactor, Warning)."

[lints]
workspace = true

[dependencies]
cofferdam-core = { workspace = true }
# cd-9hp.9 cp3 — Design.OrphanExport reads CANONICAL_GRAPH in
# finalize. Once DeadExport / ImportCycle / LayerViolation migrate,
# this dep covers them too.
cofferdam-graph = { workspace = true }
cofferdam-rust = { workspace = true }
globset = { workspace = true }
smol_str = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_semantic = "0.138.0"
oxc_span = { workspace = true }
oxc_syntax = "0.138"
# unicode-ident already lives in the dep tree via oxc transitively;
# pull it in directly so DuplicateBlock's tokeniser can recognise
# Unicode identifiers (TS allows `λ`, `α`, Han characters, etc.).
unicode-ident = "1"
# unicode-width is already in the tree via oxc-miette → textwrap; pull it
# in directly so MaxLineLength measures display columns, not UTF-8 bytes
# (cd-c8aq). Same version, so no extra compilation.
unicode-width = "0.2"
