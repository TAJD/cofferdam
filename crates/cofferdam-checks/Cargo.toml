[package]
name = "cofferdam-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in checks shipped with cofferdam (Consistency, Design, Readability, Refactor, Warning)."

[dependencies]
cofferdam-core = { workspace = true }
cofferdam-ts = { workspace = true }
# unicode-ident is the only non-cofferdam dep we keep direct: oxc pulls
# it in transitively, but DuplicateBlock's tokeniser needs the public
# Unicode-identifier predicates and shouldn't depend on a transitive
# pin. Not an oxc crate, so the platform-purity guardrail doesn't apply.
unicode-ident = "1"
