[package]
name = "cofferdam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cofferdam command-line binary."

[[bin]]
name = "cofferdam"
path = "src/main.rs"

[[test]]
name = "fix"
path = "tests/fix.rs"

[[test]]
name = "explain_plugin"
path = "tests/explain_plugin.rs"

[[test]]
name = "advise_diff"
path = "tests/advise_diff.rs"

[[test]]
name = "type_host"
path = "tests/type_host.rs"

[lints]
workspace = true

[dependencies]
cofferdam-core = { workspace = true }
cofferdam-engine = { workspace = true }
cofferdam-checks = { workspace = true }
cofferdam-formatters = { workspace = true }
# cd-9hp.4 cp5 — `cofferdam lsp` subcommand routes here.
cofferdam-lsp = { path = "../cofferdam-lsp", version = "0.3.7" }
cofferdam-typst = { workspace = true }
clap = { workspace = true }
clap-markdown = "0.1"
globset = { workspace = true }
notify = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
