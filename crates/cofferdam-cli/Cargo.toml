[package]
name = "cofferdam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cofferdam command-line binary."

[lib]
name = "cofferdam_cli"
path = "src/lib.rs"

[[bin]]
name = "cofferdam"
path = "src/main.rs"

[[test]]
name = "fix"
path = "tests/fix.rs"

[[test]]
name = "explain_plugin"
path = "tests/explain_plugin.rs"

[[test]]
name = "advise_diff"
path = "tests/advise_diff.rs"

[[test]]
name = "type_host"
path = "tests/type_host.rs"

[lints]
workspace = true

[features]
default = ["mimalloc"]
# CD-169 — mimalloc as the binary's global allocator. Kept behind a
# default-on feature so a build that can't compile mimalloc's C source
# (an exotic cross target, a hermetic no-cc sandbox) can opt out with
# `--no-default-features` without losing the CLI. Library crates stay
# allocator-neutral — this belongs to the binary only.
mimalloc = ["dep:mimalloc"]

[dependencies]
cofferdam-core = { workspace = true }
mimalloc = { version = "0.1", optional = true }
cofferdam-engine = { workspace = true }
cofferdam-checks = { workspace = true }
cofferdam-formatters = { workspace = true }
cofferdam-html = { workspace = true }
# cd-9hp.4 cp5 — `cofferdam lsp` subcommand routes here.
cofferdam-lsp = { path = "../cofferdam-lsp", version = "0.3.13" }
cofferdam-typst = { workspace = true }
# CD-84: HTML plugin AST wire builder walks tree-sitter-html nodes
# directly. Pin mirrors cofferdam-html's own tree-sitter pin — bump
# together to keep ABI in sync.
tree-sitter = "0.25"
clap = { workspace = true }
clap-markdown = "0.1"
globset = { workspace = true }
notify = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
