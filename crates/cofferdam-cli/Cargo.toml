[package]
name = "cofferdam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cofferdam command-line binary."

[[bin]]
name = "cofferdam"
path = "src/main.rs"

[[test]]
name = "fix"
path = "tests/fix.rs"

