[package]
name = "cofferdam-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Orchestration: discovery, scheduling, baseline, severity gating, and project-graph passes."

[dependencies]
cofferdam-core = { workspace = true }
# cd-9hp.9 cp3 — engine populates `CANONICAL_GRAPH` from the pass-1
# IMPORTS/EXPORTS evidence so finalize-stage checks (OrphanExport
# first) can run graph queries instead of joining flat tables.
cofferdam-graph = { workspace = true }
cofferdam-rust = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_resolver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
cofferdam-checks = { workspace = true }
# cd-acv3 (cd-9hp.9.1): storage-backend spike validating petgraph as the
# substrate for the canonical graph. Dev-dep only — not exposed to
# downstream crates until cd-9hp.9 proper lands.
petgraph = "0.8"
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
