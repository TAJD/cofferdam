schema_version = "1.0"
# Pins Warning.UnusedImport's interpretation of [public_api].exports
# (cd-5ej). Re-exports living in an allow-listed file are the published
# surface — downstream consumers are outside the corpus, so absence of
# a project-internal import does not mean unused.

[public_api]
exports = [
  "src/index.ts",
  "components/ui/**",
]
