[package]
name = "cofferdam-napi"
version = "0.1.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/TAJD/cofferdam"
authors = ["cofferdam contributors"]
rust-version = "1.78"
description = "napi-rs FFI surface — Node.js bindings for engine + plugin host (cd-81a.7)."

# Standalone crate (excluded from the workspace) so building the rest
# of the workspace doesn't require the Node dev environment. See the
# top-level Cargo.toml comment for the rationale.
[workspace]

[lib]
# `cdylib` produces the .node addon. `rlib` is intentionally omitted —
# nothing inside the cofferdam workspace links against this crate, and
# keeping the cdylib alone speeds the napi-rs build flow.
crate-type = ["cdylib"]

[dependencies]
cofferdam-core = { path = "../cofferdam-core", version = "0.1.4" }
cofferdam-ts = { path = "../cofferdam-ts", version = "0.1.4" }
cofferdam-engine = { path = "../cofferdam-engine", version = "0.1.4" }
cofferdam-checks = { path = "../cofferdam-checks", version = "0.1.4" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
