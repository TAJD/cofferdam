[package]
name = "cofferdam-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Rust source-code adapter for cofferdam — tree-sitter-rust + checks specific to Rust crates"

[dependencies]
cofferdam-core = { workspace = true }
# tree-sitter pin: bump together with tree-sitter-rust to keep ABI in sync.
# tree-sitter 0.23 is the current stable line (Nov 2025+).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
thiserror = { workspace = true }

[dev-dependencies]
# Speculative deps removed — checkpoint 2's parser tests are plain
# assertions on byte-range round-trips. Insta-style snapshots may
# return in checkpoint 3 for per-check fixture output.
