# Portable toolchain pin. `channel = "stable"` resolves to the host triple,
# so this works on Linux, macOS, and Windows CI runners without edits.
#
# Local Windows note: if your machine has gcc but no MSVC C++ workload,
# the host pick (msvc) will fail to link. Add this to the tracked
# `.cargo/config.toml`'s `[env]` table to use the GNU toolchain locally
# (it'll show as an uncommitted local diff — don't commit it, or run
# `git update-index --skip-worktree .cargo/config.toml` to hide it):
#
#   RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-gnu"
[toolchain]
channel = "stable"
profile = "minimal"
components = ["clippy", "rustfmt"]
